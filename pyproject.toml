[project]
name = "shoplite"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Kartik Vishnoi", email = "kartikvishnoi778@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.0",
    "prometheus-client>=0.26.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
shoplite = "shoplite:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
]
